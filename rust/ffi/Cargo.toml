[package]
name = "pill-packer-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Native C ABI for the Pill Packer codec"
repository = "https://github.com/AuthenticityLabs/pill-packer"
homepage = "https://github.com/AuthenticityLabs/pill-packer"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
pil-codec = { package = "pill-packer", path = "..", features = ["schema-runtime"] }
